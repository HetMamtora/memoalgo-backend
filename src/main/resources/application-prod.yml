spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1

  jpa:
    show-sql: false

# All secrets injected at runtime from Railway/Render environment variables
# Set these in Railway/Render dashboard
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# Resend, called via its HTTPS API now (not SMTP)
# RESEND_API_KEY is the SAME env var
app:
  resend:
    api-key: ${RESEND_API_KEY}
  # this will only deliver to the email tied to your Resend account.
  mail:
    from: "MemoAlgo <noreply@memoalgo.dev>"
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    com.memoalgo: WARN