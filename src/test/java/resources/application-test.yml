# ─────────────────────────────────────────────────────────
# Test profile configuration
# Used when tests run with @ActiveProfiles("test")
#
# Points to memoalgo_test database so test data never
# pollutes your development database.
# Flyway runs V1 migration on this DB automatically.
# ─────────────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/memoalgo_test
    username: postgres
    password: memoalgotest_db_password
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: test-secret-key-minimum-32-characters-long-for-hs256-algorithm
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

logging:
  level:
    com.memoalgo: WARN
    org.flywaydb: WARN